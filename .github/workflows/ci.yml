name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest --cov=app --cov-report=term-missing
      - name: Generate HQI acceptance samples
        run: python scripts/generate_hqi_acceptance_samples.py
      - name: Upload HQI acceptance samples
        uses: actions/upload-artifact@v4
        with:
          name: anniston-hqi-acceptance-samples
          path: backend/acceptance-output/*.pdf
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Validate CloudFormation
        # W1030 evaluates the intentionally empty bootstrap defaults for secret ARN
        # parameters. Both controlled deployment workflows resolve and pass exact
        # Secrets Manager ARNs before CloudFormation is invoked.
        run: cfn-lint infra/pilot-stack.yml -i W1030
      - name: Parse GitHub workflow YAML
        run: |
          ruby -ryaml -e '
            Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
              YAML.load_file(path)
              puts "validated #{path}"
            end
          '

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag "tpp-ci:${{ github.sha }}" .
      - name: Start production image
        run: |
          docker run --detach --rm --name tpp-ci -p 8000:8000 "tpp-ci:${{ github.sha }}"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs tpp-ci
          exit 1
      - name: Verify frontend is served
        run: curl --fail --silent http://127.0.0.1:8000/ | grep -q "Teacher Planning Platform"
      - name: Verify governed APIs require authentication
        run: |
          set -euo pipefail
          verify_unauthenticated() {
            local path="$1"
            local status
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:8000$path")"
            if [[ "$status" != "401" ]]; then
              echo "Expected HTTP 401 from $path; received $status" >&2
              exit 1
            fi
          }
          verify_unauthenticated /api/v1/templates/anniston-hqi/fields
          verify_unauthenticated /api/v1/teaching-assignments
          verify_unauthenticated /api/v1/administration/usage
          verify_unauthenticated /api/v1/administration/costs
      - name: Show container logs on failure
        if: failure()
        run: docker logs tpp-ci || true
