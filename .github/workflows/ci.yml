name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest --cov=app --cov-report=term-missing --junitxml=pytest-results.xml
      - name: Upload pytest failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-failure
          path: backend/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Extract current Alabama Arts source lines
        continue-on-error: true
        run: |
          python - <<'PY' > arts-extraction.txt
          from app.standards_ingest import extract_document, fetch_source

          url = (
              "https://www.alabamaachieves.org/wp-content/uploads/2025/01/"
              "AS_20250108_2024-Alabama-Course-of-Study-Arts-Education_V1.0.pdf"
          )
          fetched = fetch_source(url, "pdf")
          extracted = extract_document(fetched)
          print(f"source_sha256={fetched.source_sha256}")
          print(f"normalized_sha256={extracted.normalized_sha256}")
          print(f"line_count={len(extracted.lines)}")
          for index, line in enumerate(extracted.lines):
              print(f"{index:05d}\t{line}")
          PY
      - name: Upload Alabama Arts extraction diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alabama-arts-extraction-diagnostic
          path: backend/arts-extraction.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Extract Alabama ELA layout diagnostic
        continue-on-error: true
        run: |
          python - <<'PY' > ela-layout-extraction.txt
          from io import BytesIO

          from pypdf import PdfReader

          from app.standards_ingest import fetch_source

          url = (
              "https://www.alabamaachieves.org/wp-content/uploads/2023/06/"
              "CAS_202353_2021-Alabama-Course-of-Study-English-Language-Arts_V1.0.pdf"
          )
          fetched = fetch_source(url, "pdf")
          reader = PdfReader(BytesIO(fetched.content))
          selected_pages = tuple(range(52, 57)) + tuple(range(96, 102)) + tuple(range(119, 125))
          print(f"source_sha256={fetched.source_sha256}")
          print(f"page_count={len(reader.pages)}")
          for page_index in selected_pages:
              if page_index >= len(reader.pages):
                  continue
              print(f"\n===== PDF PAGE INDEX {page_index} =====")
              text = reader.pages[page_index].extract_text(
                  extraction_mode="layout",
                  layout_mode_space_vertically=False,
              ) or ""
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if line.strip():
                      print(f"{line_number:04d}\t{line.rstrip()}")
          PY
      - name: Upload Alabama ELA layout diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alabama-ela-layout-diagnostic
          path: backend/ela-layout-extraction.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Generate HQI acceptance samples
        run: python scripts/generate_hqi_acceptance_samples.py
      - name: Upload HQI acceptance samples
        uses: actions/upload-artifact@v4
        with:
          name: anniston-hqi-acceptance-samples
          path: backend/acceptance-output/*.pdf
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Validate CloudFormation
        # W1030 evaluates the intentionally empty bootstrap defaults for secret ARN
        # parameters. Controlled workflows resolve and pass exact secret ARNs.
        run: cfn-lint infra/pilot-stack.yml -i W1030
      - name: Parse GitHub workflow YAML
        run: |
          ruby -ryaml -e '
            Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
              YAML.load_file(path)
              puts "validated #{path}"
            end
          '
      - name: Parse repository shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            bash -n "$path"
            echo "validated $path"
          done < <(find scripts -type f -name '*.sh' -print0)

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag "tpp-ci:${{ github.sha }}" .
      - name: Verify PDF generation with a read-only root
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "tpp-ci:${{ github.sha }}" \
            python -c '
          from app.document_service import generate_anniston_hqi_packet
          packet, documents = generate_anniston_hqi_packet({
              "teacher": "CI Teacher",
              "course": "CI Course",
              "week_of": "2026-08-10",
              "literacy_standards": "Synthetic literacy standard",
              "act_preparation": "Synthetic ACT preparation",
          })
          assert packet.startswith(b"%PDF")
          assert len(documents) == 3
          '
      - name: Start production image with a read-only root
        run: |
          docker run --detach --rm \
            --name tpp-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 8000:8000 \
            "tpp-ci:${{ github.sha }}"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs tpp-ci
          exit 1
      - name: Verify frontend is served
        run: curl --fail --silent http://127.0.0.1:8000/ | grep -q "Teacher Planning Platform"
      - name: Verify governed APIs require authentication
        run: |
          set -euo pipefail
          verify_unauthenticated() {
            local path="$1"
            local status
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:8000$path")"
            if [[ "$status" != "401" ]]; then
              echo "Expected HTTP 401 from $path; received $status" >&2
              exit 1
            fi
          }
          verify_unauthenticated /api/v1/templates/anniston-hqi/fields
          verify_unauthenticated /api/v1/teaching-assignments
          verify_unauthenticated /api/v1/administration/usage
          verify_unauthenticated /api/v1/administration/costs
      - name: Show container logs on failure
        if: failure()
        run: docker logs tpp-ci || true
