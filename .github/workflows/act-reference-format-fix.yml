name: ACT Reference Format Fix

on:
  pull_request:
    paths:
      - ".github/workflows/act-reference-format-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-e-standards-ai
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and repair ACT files
        run: |
          python -m pip install ruff==0.16.2
          ruff format backend/app/act_reference.py backend/app/act_reference_admin_api.py backend/tests/test_act_reference.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/app/act_reference.py": (
                  '                    "select": "reference_code,domain,category,score_range,exact_text,source_id,snapshot_id",\n',
                  '                    "select": (\n'
                  '                        "reference_code,domain,category,score_range,exact_text,"\n'
                  '                        "source_id,snapshot_id"\n'
                  '                    ),\n',
              ),
              "backend/app/act_reference_admin_api.py": (
                  '                    "select": "id,source_id,retrieved_at,parser_version,source_sha256,normalized_sha256,status",\n',
                  '                    "select": (\n'
                  '                        "id,source_id,retrieved_at,parser_version,source_sha256,"\n'
                  '                        "normalized_sha256,status"\n'
                  '                    ),\n',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected formatted select anchor missing: {filename}")
              path.write_text(text.replace(old, new, 1))
          PY
          ruff format backend/app/act_reference.py backend/app/act_reference_admin_api.py backend/tests/test_act_reference.py
          ruff check --fix backend/app/act_reference.py backend/app/act_reference_admin_api.py backend/tests/test_act_reference.py
          ruff check backend/app/act_reference.py backend/app/act_reference_admin_api.py backend/tests/test_act_reference.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/act_reference.py backend/app/act_reference_admin_api.py backend/tests/test_act_reference.py
          git diff --cached --quiet && exit 0
          git commit -m "Format ACT reference foundation"
          git push origin HEAD:feature/gate-e-standards-ai
