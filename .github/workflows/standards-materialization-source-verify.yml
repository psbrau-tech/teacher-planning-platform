name: Standards Materialization Source Verify

on:
  pull_request:
    paths:
      - 'backend/app/standards_*.py'
      - 'backend/tests/test_standard*.py'
      - 'supabase/migrations/*standard*'
      - '.github/workflows/standards-materialization-source-verify.yml'

permissions:
  contents: read

jobs:
  verify-materialization-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Fetch and parse every current Alabama materialization source read-only
        run: |
          python - <<'PY'
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_course_catalog import parse_course_catalog_document
          from app.standards_ingest import extract_document, fetch_source
          from app.standards_parser_dispatch import parse_governed_standards_document
          from app.standards_source_registry import source_ingest_plan

          sources = fetch_current_alabama_catalog()
          failures: list[str] = []
          verified = 0

          print(f"discovered_source_count={len(sources)}")
          print("database_writes=0")

          for source in sources:
              plan = source_ingest_plan(source)
              print(
                  "source="
                  f"{source.source_key}|{source.family}|{source.category_name}|"
                  f"{source.edition}|{plan.parser_key}|{plan.source_kind}|"
                  f"{source.document_format}"
              )
              if not plan.parser_ready:
                  failures.append(
                      f"{source.source_key}: deterministic parser is not ready"
                  )
                  continue
              if source.document_format not in {"pdf", "docx"}:
                  failures.append(
                      f"{source.source_key}: unsupported discovered format "
                      f"{source.document_format}"
                  )
                  continue

              try:
                  fetched = fetch_source(source.document_url, source.document_format)
                  extracted = extract_document(fetched)
                  if plan.source_kind == "program_guide":
                      parsed_catalog = parse_course_catalog_document(
                          plan.parser_key,
                          extracted,
                      )
                      course_keys = [course.course_key for course in parsed_catalog.courses]
                      parser_version = parsed_catalog.parser_version
                      entry_count = 0
                  elif plan.provides_standard_entries:
                      parsed = parse_governed_standards_document(
                          plan.parser_key,
                          extracted,
                      )
                      course_keys = [course.course_key for course in parsed.courses]
                      parser_version = parsed.parser_version
                      entry_count = sum(len(course.standards) for course in parsed.courses)
                      empty_courses = [
                          course.course_key for course in parsed.courses if not course.standards
                      ]
                      if empty_courses:
                          failures.append(
                              f"{source.source_key}: courses without standards: {empty_courses}"
                          )
                          continue
                  else:
                      failures.append(
                          f"{source.source_key}: unsupported materialization role "
                          f"{plan.source_kind}"
                      )
                      continue
              except Exception as error:
                  failures.append(
                      f"{source.source_key}: {type(error).__name__}: {error}"
                  )
                  continue

              if not course_keys:
                  failures.append(f"{source.source_key}: parser produced no courses")
                  continue
              if len(course_keys) != len(set(course_keys)):
                  failures.append(
                      f"{source.source_key}: parser produced duplicate course IDs"
                  )
                  continue

              verified += 1
              print(
                  "verified_materialization_source="
                  f"{source.source_key}|{fetched.source_sha256}|{parser_version}|"
                  f"{len(course_keys)}|{entry_count}"
              )

          print(f"verified_materialization_source_count={verified}")
          if failures:
              print("verification_failures:")
              for failure in failures:
                  print(f"- {failure}")
              raise RuntimeError(
                  f"{len(failures)} current Alabama materialization source(s) failed verification"
              )
          if verified != len(sources):
              raise RuntimeError("Not every current Alabama source was materialization-verified")
          PY
