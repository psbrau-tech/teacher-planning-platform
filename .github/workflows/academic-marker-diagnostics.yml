name: Academic Marker Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/academic-marker-diagnostics.yml'
      - 'backend/app/standards_alabama_math.py'
      - 'backend/app/standards_alabama_science.py'
      - 'backend/app/standards_alabama_social_studies.py'

permissions:
  contents: read

jobs:
  diagnose-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect current academic section markers read-only
        run: |
          python - <<'PY'
          from app.standards_alabama_math import _COURSES as MATH_COURSES
          from app.standards_alabama_science import _COURSES as SCIENCE_COURSES, _STEM_PREFIX
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          source_map = {s.source_key: s for s in fetch_current_alabama_catalog()}
          print('database_writes=0')

          def load(key):
              source = source_map[key]
              fetched = fetch_source(source.document_url, source.document_format)
              return extract_document(fetched).lines

          lines = load('alabama_academic_mathematics')
          print('=== mathematics ===')
          for _, display_name, _ in MATH_COURSES:
              variants = [
                  (i, line) for i, line in enumerate(lines)
                  if display_name.lower() in line.lower()
                  and 'content' in line.lower()
                  and 'standard' in line.lower()
                  and len(line) <= 180
              ]
              print(f'math|{display_name}|variants={variants[:8]}')

          lines = load('alabama_academic_science')
          print('=== science ===')
          markers = [i for i, line in enumerate(lines) if line.startswith(_STEM_PREFIX)]
          print(f'science_stem_markers={len(markers)}')
          for (_, display_name, _), marker in zip(SCIENCE_COURSES, markers, strict=False):
              context = lines[max(0, marker - 30):marker]
              print(
                  f'science|{display_name}|marker={marker}|heading_present={display_name in context}'
                  f'|context={context[-8:]}'
              )

          lines = load('alabama_academic_social_studies')
          print('=== social_studies_content_sections ===')
          standards_markers = [
              i for i, line in enumerate(lines)
              if line.lower().replace(' ', '') in {'contentstandards', 'contentstandard'}
          ]
          print(f'social_content_markers={len(standards_markers)}')
          for marker in standards_markers:
              before = lines[max(0, marker - 12):marker]
              after = lines[marker + 1:min(len(lines), marker + 8)]
              print(
                  f'social_marker={marker}|before={before}|after={after}'
              )
          PY
