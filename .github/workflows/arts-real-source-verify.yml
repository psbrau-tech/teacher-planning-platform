name: Arts Real Source Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-arts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Parse current Alabama Arts source read-only
        run: |
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          from time import sleep

          from app.standards_alabama_arts import (
              _course_key,
              _discover_sections,
              parse_alabama_arts_2024,
          )
          from app.standards_ingest import (
              FetchedSource,
              MAX_SOURCE_BYTES,
              StandardsIngestError,
              extract_document,
              fetch_source,
          )

          url = (
              "https://www.alabamaachieves.org/wp-content/uploads/2025/01/"
              "AS_20250108_2024-Alabama-Course-of-Study-Arts-Education_V1.0.pdf"
          )

          # Prefer the application's normal transport. GitHub-hosted runners can experience
          # resolver-specific failures for an otherwise reachable public source, so retry only
          # the bounded source-unavailable condition. Invalid content and parser failures still
          # fail closed immediately.
          fetched = None
          transport = "system-dns"
          for attempt in range(1, 5):
              try:
                  fetched = fetch_source(url, "pdf")
                  break
              except StandardsIngestError as error:
                  if str(error) != "Authoritative standards source is unavailable":
                      raise
                  if attempt < 4:
                      wait_seconds = 15 * attempt
                      print(
                          f"authoritative source unavailable on attempt {attempt}/4; "
                          f"retrying in {wait_seconds}s"
                      )
                      sleep(wait_seconds)

          if fetched is None:
              # Keep the source authoritative while bypassing only the runner's failing system
              # DNS path. curl resolves the official Alabama hostname through DNS-over-HTTPS,
              # bootstrapped to Cloudflare by IP, while normal TLS certificate verification
              # remains enabled for both the DoH server and the Alabama HTTPS endpoint.
              print("system DNS could not resolve the authoritative source; trying TLS-verified DoH")
              transport = "cloudflare-doh"
              with TemporaryDirectory() as temp_dir:
                  source_path = Path(temp_dir) / "alabama-arts.pdf"
                  try:
                      completed = subprocess.run(
                          [
                              "curl",
                              "--fail",
                              "--silent",
                              "--show-error",
                              "--location",
                              "--doh-url",
                              "https://cloudflare-dns.com/dns-query",
                              "--resolve",
                              "cloudflare-dns.com:443:1.1.1.1",
                              "--connect-timeout",
                              "30",
                              "--max-time",
                              "120",
                              "--output",
                              str(source_path),
                              "--write-out",
                              "%{url_effective}",
                              url,
                          ],
                          check=True,
                          capture_output=True,
                          text=True,
                      )
                  except subprocess.CalledProcessError as error:
                      if error.stderr:
                          print(error.stderr.strip())
                      raise StandardsIngestError(
                          "Authoritative standards source is unavailable"
                      ) from error

                  content = source_path.read_bytes()
                  if not content or len(content) > MAX_SOURCE_BYTES:
                      raise StandardsIngestError(
                          "Authoritative standards source has an invalid size"
                      )
                  if not content.startswith(b"%PDF"):
                      raise StandardsIngestError(
                          "Authoritative standards PDF returned unexpected content"
                      )
                  resolved_url = completed.stdout.strip() or url
                  fetched = FetchedSource(
                      requested_url=url,
                      resolved_url=resolved_url,
                      document_format="pdf",
                      content=content,
                      source_sha256=sha256(content).hexdigest(),
                  )

          extracted = extract_document(fetched)
          markers = tuple(
              index for index, line in enumerate(extracted.lines) if line == "Content Standards"
          )
          sections = _discover_sections(extracted.lines, markers)
          candidate_keys = []
          for section in sections:
              print(
                  "section="
                  f"{section.discipline}|{section.course_family or '-'}|"
                  f"{section.section_name}|"
                  f"{','.join(lane for lane, _ in section.lanes)}"
              )
              for lane, _ in section.lanes:
                  candidate_keys.append(
                      _course_key(
                          section.discipline,
                          section.section_name,
                          lane,
                          section.course_family,
                      )
                  )
          duplicate_keys = sorted(
              key for key, count in Counter(candidate_keys).items() if count > 1
          )
          if duplicate_keys:
              raise RuntimeError(
                  f"duplicate canonical Arts course identities: {duplicate_keys}"
              )

          parsed = parse_alabama_arts_2024(extracted)
          print(f"source_transport={transport}")
          print(f"resolved_url={fetched.resolved_url}")
          print(f"source_sha256={fetched.source_sha256}")
          print(f"normalized_sha256={extracted.normalized_sha256}")
          print(f"parser_version={parsed.parser_version}")
          print(f"course_count={len(parsed.courses)}")
          print(f"standard_count={sum(len(course.standards) for course in parsed.courses)}")
          print("database_writes=0")
          for course in parsed.courses:
              print(f"course={course.course_key}|{course.display_name}|{len(course.standards)}")
          PY
