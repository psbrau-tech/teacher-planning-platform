name: Temporary AAS Math Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/aas-math-diagnostic.yml'
      - 'backend/app/standards_alabama_aas_hardened.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Print authoritative Math AAS extraction lines
        run: |
          python - <<'PY'
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          source = next(
              item
              for item in fetch_current_alabama_catalog()
              if item.source_key == 'alabama_alternate_mathematics'
          )
          fetched = fetch_source(source.document_url, source.document_format)
          extracted = extract_document(fetched)
          print(f'source_sha256={fetched.source_sha256}')
          print(f'normalized_sha256={extracted.normalized_sha256}')
          matches = [
              (index, line)
              for index, line in enumerate(extracted.lines)
              if 'M.AAS.K' in line or 'M.G.AAS.9' in line or 'M.AAS.1' in line
          ]
          for index, line in matches[:80]:
              print(f'line[{index}]={line!r}')
              for offset in (1, 2):
                  if index + offset < len(extracted.lines):
                      print(f'line[{index + offset}]={extracted.lines[index + offset]!r}')
          PY
