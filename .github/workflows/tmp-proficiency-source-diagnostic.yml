name: Temporary Proficiency Source Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-proficiency-source-diagnostic.yml'
      - 'backend/app/standards_sources.py'
      - 'backend/app/standards_proficiency.py'

permissions:
  contents: read

jobs:
  inspect-proficiency-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect current Grade 6 extracted text
        working-directory: backend
        run: |
          python - <<'PY'
          from app.standards_ingest import extract_document, fetch_source
          from app.standards_sources import resolve_authoritative_document

          resolved = resolve_authoritative_document(
              'alabama_ela_proficiency_grade_6_current',
              'https://english-language-arts.alsde.edu/proficiency-scales',
          )
          print('resolved_url=' + resolved.document_url)
          print('resolved_label=' + resolved.anchor_text)
          fetched = fetch_source(resolved.document_url, 'pdf')
          print('resolved_fetch_url=' + fetched.resolved_url)
          print('source_sha256=' + fetched.source_sha256)
          extracted = extract_document(fetched)
          print('normalized_sha256=' + extracted.normalized_sha256)
          print('extracted_line_count=' + str(len(extracted.lines)))
          for index, line in enumerate(extracted.lines[:240], start=1):
              print(f'LINE {index:03d}: {line}')
          PY
