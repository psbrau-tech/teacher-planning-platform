name: Deploy TPP Pilot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this controlled pilot deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy exact image through CloudFormation
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.TPP_CLOUDFORMATION_ROLE_ARN }}
      STACK_NAME: ${{ vars.TPP_CLOUDFORMATION_STACK || 'TeacherPlanningPlatformPilot' }}
      ECR_REPOSITORY: ${{ vars.TPP_ECR_REPOSITORY || 'teacher-planning-platform-pilot' }}
      ECS_CLUSTER: ${{ vars.TPP_ECS_CLUSTER || 'teacher-planning-platform-pilot' }}
      ECS_SERVICE: ${{ vars.TPP_ECS_SERVICE || 'teacher-planning-platform-pilot' }}
      TASK_DEFINITION_FAMILY: ${{ vars.TPP_TASK_DEFINITION_FAMILY || 'teacher-planning-platform-pilot' }}
      VITE_SUPABASE_URL: ${{ vars.TPP_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TPP_SUPABASE_ANON_KEY }}
      CONFIGURED_CERTIFICATE_ARN: ${{ vars.TPP_CERTIFICATE_ARN }}
      SUPABASE_URL_SECRET_ID: ${{ vars.TPP_SUPABASE_URL_SECRET_ID || 'tpp/pilot/supabase-url' }}
      SUPABASE_ANON_KEY_SECRET_ID: ${{ vars.TPP_SUPABASE_ANON_KEY_SECRET_ID || 'tpp/pilot/supabase-anon-key' }}
    steps:
      - name: Validate controlled deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_ROLE_ARN
            CLOUDFORMATION_ROLE_ARN
            STACK_NAME
            ECR_REPOSITORY
            ECS_CLUSTER
            ECS_SERVICE
            TASK_DEFINITION_FAMILY
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required tpp-pilot values: %s\n' "${missing[*]}" >&2
            echo "Run Preflight TPP Pilot Release after correcting the protected environment." >&2
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-2" ]]; then
            echo "TPP pilot deployment is locked to us-east-2." >&2
            exit 1
          fi
          expected_cloudformation_role="arn:aws:iam::697091778129:role/TeacherPlanningPlatformPilotCloudFormationExecution"
          if [[ "$CLOUDFORMATION_ROLE_ARN" != "$expected_cloudformation_role" ]]; then
            echo "TPP_CLOUDFORMATION_ROLE_ARN must match the approved pilot execution role." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infra/pilot-stack.yml

      - name: Resolve exact runtime secret ARNs
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          resolve_secret() {
            local output_name="$1"
            local secret_id="$2"
            local arn
            arn="$(aws secretsmanager describe-secret \
              --secret-id "$secret_id" \
              --query ARN \
              --output text)"
            if [[ -z "$arn" || "$arn" == "None" ]]; then
              echo "Unable to resolve runtime secret: $secret_id" >&2
              exit 1
            fi
            echo "$output_name=$arn" >> "$GITHUB_OUTPUT"
          }
          resolve_secret supabase_url "$SUPABASE_URL_SECRET_ID"
          resolve_secret supabase_anon_key "$SUPABASE_ANON_KEY_SECRET_ID"

      - name: Resolve current service, certificate, and rollback baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          stack_json="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --output json)"
          stack_status="$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")"
          case "$stack_status" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "Pilot stack is not stable: $stack_status" >&2
              exit 1
              ;;
          esac
          output_value() {
            jq -r --arg key "$1" '
              .Stacks[0].Outputs[]
              | select(.OutputKey == $key)
              | .OutputValue
            ' <<<"$stack_json"
          }
          stack_task_definition="$(output_value TaskDefinitionArn)"
          alb_arn="$(output_value LoadBalancerArn)"
          if [[ -z "$stack_task_definition" || "$stack_task_definition" == "not-deployed" ]]; then
            echo "The pilot stack has no deployed service. Use Bootstrap TPP Pilot first." >&2
            exit 1
          fi

          service_json="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"
          if [[ "$(jq '.failures | length' <<<"$service_json")" != "0" ]]; then
            jq '.failures' <<<"$service_json" >&2
            exit 1
          fi
          current_task_definition="$(jq -r '.services[0].taskDefinition' <<<"$service_json")"
          if [[ "$current_task_definition" != "$stack_task_definition" ]]; then
            echo "ECS task-definition drift exists between the service and CloudFormation." >&2
            echo "Stack:   $stack_task_definition" >&2
            echo "Service: $current_task_definition" >&2
            exit 1
          fi

          task_json="$(aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --output json)"
          current_image="$(jq -r '.taskDefinition.containerDefinitions[0].image' <<<"$task_json")"
          if [[ ! "$current_image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The current service image is not immutable." >&2
            exit 1
          fi
          secret_names="$(jq -r '.taskDefinition.containerDefinitions[0].secrets[].name' <<<"$task_json" | sort)"
          if [[ "$secret_names" != $'TPP_SUPABASE_ANON_KEY\nTPP_SUPABASE_URL' ]]; then
            echo "The current task does not use the approved least-privilege runtime secret set:" >&2
            echo "$secret_names" >&2
            exit 1
          fi

          listeners="$(aws elbv2 describe-listeners \
            --load-balancer-arn "$alb_arn" \
            --output json)"
          active_certificate="$(jq -r '
            [.Listeners[]
              | select(.Port == 443 and .Protocol == "HTTPS")
              | .Certificates[0].CertificateArn][0] // ""
          ' <<<"$listeners")"
          if [[ -n "$active_certificate" && -n "$CONFIGURED_CERTIFICATE_ARN" \
            && "$active_certificate" != "$CONFIGURED_CERTIFICATE_ARN" ]]; then
            echo "TPP_CERTIFICATE_ARN does not match the active HTTPS listener." >&2
            echo "Use Enable TPP Pilot TLS for certificate changes." >&2
            exit 1
          fi
          if [[ -z "$active_certificate" && -n "$CONFIGURED_CERTIFICATE_ARN" ]]; then
            echo "TPP_CERTIFICATE_ARN is set but TLS is not attached; deployment will preserve HTTP-only state." >&2
          fi

          echo "task_definition=$current_task_definition" >> "$GITHUB_OUTPUT"
          echo "image=$current_image" >> "$GITHUB_OUTPUT"
          echo "certificate_arn=$active_certificate" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or reuse exact pilot image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: bash scripts/build_or_reuse_pilot_image.sh

      - name: Deploy exact image through CloudFormation
        if: ${{ steps.baseline.outputs.image != steps.image.outputs.immutable_image }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/pilot-stack.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EcrRepositoryName="$ECR_REPOSITORY" \
              EcsClusterName="$ECS_CLUSTER" \
              EcsServiceName="$ECS_SERVICE" \
              TaskDefinitionFamily="$TASK_DEFINITION_FAMILY" \
              ImageUri="${{ steps.image.outputs.immutable_image }}" \
              DeployService=true \
              CertificateArn="${{ steps.baseline.outputs.certificate_arn }}" \
              PublicBaseUrl=https://planner.guidedscholar.ai \
              AllowedEmailDomains=anniston.k12.al.us \
              SupabaseUrlSecretArn="${{ steps.secrets.outputs.supabase_url }}" \
              SupabaseAnonKeySecretArn="${{ steps.secrets.outputs.supabase_anon_key }}"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify CloudFormation, ECS, target health, and exact image
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stack_json="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --output json)"
          stack_status="$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")"
          if [[ "$stack_status" != "UPDATE_COMPLETE" && "$stack_status" != "CREATE_COMPLETE" ]]; then
            echo "Pilot stack is not stable after deployment: $stack_status" >&2
            exit 1
          fi
          output_value() {
            jq -r --arg key "$1" '
              .Stacks[0].Outputs[]
              | select(.OutputKey == $key)
              | .OutputValue
            ' <<<"$stack_json"
          }
          expected_task_definition="$(output_value TaskDefinitionArn)"
          target_group_arn="$(output_value TargetGroupArn)"

          service_json="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"
          deployed_task_definition="$(jq -r '.services[0].taskDefinition' <<<"$service_json")"
          if [[ "$deployed_task_definition" != "$expected_task_definition" ]]; then
            echo "ECS and CloudFormation task definitions do not match after deployment." >&2
            exit 1
          fi
          deployed_image="$(aws ecs describe-task-definition \
            --task-definition "$deployed_task_definition" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)"
          if [[ "$deployed_image" != "${{ steps.image.outputs.immutable_image }}" ]]; then
            echo "ECS task image does not match the accepted exact digest." >&2
            exit 1
          fi

          desired_count="$(jq -r '.services[0].desiredCount' <<<"$service_json")"
          running_count="$(jq -r '.services[0].runningCount' <<<"$service_json")"
          pending_count="$(jq -r '.services[0].pendingCount' <<<"$service_json")"
          rollout_state="$(jq -r '
            .services[0].deployments[]
            | select(.status == "PRIMARY")
            | .rolloutState
          ' <<<"$service_json")"
          if [[ "$desired_count" -lt 1 || "$running_count" != "$desired_count" || "$pending_count" != "0" ]]; then
            echo "ECS service is not fully running: desired=$desired_count running=$running_count pending=$pending_count" >&2
            exit 1
          fi
          if [[ "$rollout_state" != "COMPLETED" ]]; then
            echo "ECS primary deployment is not complete: $rollout_state" >&2
            exit 1
          fi

          target_health="$(aws elbv2 describe-target-health \
            --target-group-arn "$target_group_arn" \
            --output json)"
          target_count="$(jq '.TargetHealthDescriptions | length' <<<"$target_health")"
          unhealthy_count="$(jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy")] | length' <<<"$target_health")"
          if [[ "$target_count" -lt 1 || "$unhealthy_count" != "0" ]]; then
            jq '.TargetHealthDescriptions' <<<"$target_health" >&2
            exit 1
          fi

          echo "task_definition=$deployed_task_definition" >> "$GITHUB_OUTPUT"
          echo "healthy_targets=$target_count" >> "$GITHUB_OUTPUT"

      - name: Publish controlled deployment record
        shell: bash
        run: |
          set -euo pipefail
          deployment_changed=true
          if [[ "${{ steps.baseline.outputs.image }}" == "${{ steps.image.outputs.immutable_image }}" ]]; then
            deployment_changed=false
          fi
          {
            echo "## TPP pilot deployment"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build configuration fingerprint: \`${{ steps.image.outputs.build_config_fingerprint }}\`"
            echo "- Image: \`${{ steps.image.outputs.immutable_image }}\`"
            echo "- Existing immutable image reused: \`${{ steps.image.outputs.reused }}\`"
            echo "- Deployment changed: \`$deployment_changed\`"
            echo "- Task definition: \`${{ steps.verify.outputs.task_definition }}\`"
            echo "- ECS cluster/service: \`$ECS_CLUSTER / $ECS_SERVICE\`"
            echo "- Healthy targets: \`${{ steps.verify.outputs.healthy_targets }}\`"
            echo "- Certificate preserved: \`${{ steps.baseline.outputs.certificate_arn || 'not-attached' }}\`"
            echo "- CloudFormation execution role: \`$CLOUDFORMATION_ROLE_ARN\`"
            echo "- Rollback task definition: \`${{ steps.baseline.outputs.task_definition }}\`"
            echo "- CloudFormation and ECS task provenance: \`synchronized\`"
            echo "- Runtime secret mappings: \`TPP_SUPABASE_URL, TPP_SUPABASE_ANON_KEY\`"
            echo "- High-privilege runtime credentials: \`not injected\`"
            echo "- Data boundary: teacher and curriculum data only; no student data"
          } >> "$GITHUB_STEP_SUMMARY"
