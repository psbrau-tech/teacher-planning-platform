name: ACT Reference Integration Patch

on:
  push:
    branches:
      - feature/gate-e-standards-ai
    paths:
      - ".github/workflows/act-reference-integration-patch.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-e-standards-ai
          fetch-depth: 0
      - name: Patch ACT governed reference integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_str: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_str)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch("backend/app/main.py", [
              (
                  'from .administration_api import router as administration_router\n',
                  'from .administration_api import router as administration_router\n'
                  'from .act_reference_admin_api import router as act_reference_admin_router\n',
              ),
              (
                  'app.include_router(administration_router)\n',
                  'app.include_router(administration_router)\napp.include_router(act_reference_admin_router)\n',
              ),
          ])

          patch("backend/app/ai_planning_api.py", [
              (
                  'from .ai_openai import AiServiceError, AiUsage, request_structured_response\n',
                  'from .act_reference import (\n'
                  '    ActReferenceError,\n'
                  '    load_act_candidate_entries,\n'
                  '    load_approved_act_entries,\n'
                  ')\n'
                  'from .ai_openai import AiServiceError, AiUsage, request_structured_response\n',
              ),
              (
                  'class PlanningSuggestion(BaseModel):\n',
                  'class ModelPlanningSuggestion(BaseModel):\n'
                  '    model_config = ConfigDict(extra="forbid")\n\n'
                  '    learning_targets: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    know: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    understand: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    do_statement: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    activities: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    assessments: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    resources: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    literacy_standards: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    recommended_act_reference_ids: list[str] = Field(default_factory=list, max_length=8)\n'
                  '    act_instructional_application: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n'
                  '    alignment_summary: str = Field(max_length=_AI_FIELD_MAX_LENGTH)\n\n\n'
                  'class PlanningSuggestion(BaseModel):\n',
              ),
              (
                  '        "act_preparation": {"type": "string", "maxLength": _AI_FIELD_MAX_LENGTH},\n',
                  '        "recommended_act_reference_ids": {\n'
                  '            "type": "array", "items": {"type": "string"}, "maxItems": 8\n'
                  '        },\n'
                  '        "act_instructional_application": {\n'
                  '            "type": "string", "maxLength": _AI_FIELD_MAX_LENGTH\n'
                  '        },\n',
              ),
              (
                  '        "act_preparation",\n',
                  '        "recommended_act_reference_ids",\n'
                  '        "act_instructional_application",\n',
              ),
              (
                  'names, grades, accommodations, IEPs, or individual performance. If an ACT or literacy connection is\nnot genuinely useful for the selected standards, return a short neutral statement rather than\ninventing an alignment. Return only the requested structured fields."""\n',
                  'names, grades, accommodations, IEPs, or individual performance. ACT references are a separate\n'
                  'governed first-party ACT catalog. Recommend only reference IDs supplied in\n'
                  'approved_act_reference_candidates; never invent an ACT ID or rewrite ACT reference wording. If no\n'
                  'authentic ACT connection is useful, return an empty ID list and a short neutral instructional\n'
                  'application. Return only the requested structured fields."""\n',
              ),
              (
                  '    context = _build_context(assignment, scheduled_rows, lesson_titles, standards, current)\n\n    try:\n',
                  '    context = _build_context(assignment, scheduled_rows, lesson_titles, standards, current)\n'
                  '    try:\n'
                  '        act_candidates = load_act_candidate_entries(client, str(context))\n'
                  '    except ActReferenceError as error:\n'
                  '        raise HTTPException(\n'
                  '            status_code=503, detail="Approved ACT reference catalog is unavailable"\n'
                  '        ) from error\n'
                  '    context["approved_act_reference_candidates"] = [\n'
                  '        {\n'
                  '            "reference_id": item.get("reference_code"),\n'
                  '            "domain": item.get("domain"),\n'
                  '            "category": item.get("category"),\n'
                  '            "score_range": item.get("score_range"),\n'
                  '            "authoritative_text": item.get("exact_text"),\n'
                  '        }\n'
                  '        for item in act_candidates\n'
                  '    ]\n\n'
                  '    try:\n',
              ),
              (
                  '    try:\n        suggestions = PlanningSuggestion.model_validate(result.data)\n    except ValidationError as error:\n',
                  '    try:\n'
                  '        model_suggestions = ModelPlanningSuggestion.model_validate(result.data)\n'
                  '        act_entries = load_approved_act_entries(\n'
                  '            client, model_suggestions.recommended_act_reference_ids\n'
                  '        )\n'
                  '        if act_entries:\n'
                  '            resolved_lines = [\n'
                  '                f"{item.get(\'reference_code\')} — {item.get(\'exact_text\')}"\n'
                  '                for item in act_entries\n'
                  '            ]\n'
                  '            act_preparation = (\n'
                  '                "ACT College and Career Readiness connection:\\n- "\n'
                  '                + "\\n- ".join(resolved_lines)\n'
                  '                + "\\nInstructional application: "\n'
                  '                + model_suggestions.act_instructional_application\n'
                  '            )\n'
                  '        else:\n'
                  '            act_preparation = model_suggestions.act_instructional_application\n'
                  '        suggestions = PlanningSuggestion(\n'
                  '            learning_targets=model_suggestions.learning_targets,\n'
                  '            know=model_suggestions.know,\n'
                  '            understand=model_suggestions.understand,\n'
                  '            do_statement=model_suggestions.do_statement,\n'
                  '            activities=model_suggestions.activities,\n'
                  '            assessments=model_suggestions.assessments,\n'
                  '            resources=model_suggestions.resources,\n'
                  '            literacy_standards=model_suggestions.literacy_standards,\n'
                  '            act_preparation=act_preparation,\n'
                  '            alignment_summary=model_suggestions.alignment_summary,\n'
                  '        )\n'
                  '    except (ValidationError, ActReferenceError) as error:\n',
              ),
              (
                  '            detail="AI planning assistance returned invalid structured data",\n',
                  '            detail="AI planning assistance returned invalid or unapproved reference data",\n',
              ),
          ])

          patch("backend/tests/test_ai_planning_api.py", [
              (
                  '        if resource == "ai_usage_events":\n',
                  '        if resource == "act_reference_entries":\n'
                  '            return [{\n'
                  '                "reference_code": "CLR 401",\n'
                  '                "domain": "Reading",\n'
                  '                "category": "CLR",\n'
                  '                "score_range": "20-23",\n'
                  '                "exact_text": "Locate important details in somewhat challenging passages",\n'
                  '                "source_id": str(SOURCE_ID),\n'
                  '                "snapshot_id": str(SNAPSHOT_ID),\n'
                  '            }]\n'
                  '        if resource == "ai_usage_events":\n',
              ),
              (
                  '            "act_preparation": "Identify main ideas and supporting evidence.",\n',
                  '            "recommended_act_reference_ids": ["CLR 401"],\n'
                  '            "act_instructional_application": "Identify main ideas and supporting evidence.",\n',
              ),
              (
                  '    assert body["suggestions"]["learning_targets"] == "Compare leadership styles."\n',
                  '    assert body["suggestions"]["learning_targets"] == "Compare leadership styles."\n'
                  '    assert "CLR 401" in body["suggestions"]["act_preparation"]\n'
                  '    assert "Locate important details" in body["suggestions"]["act_preparation"]\n',
              ),
              (
                  '    assert context["current_teacher_plan"]["learning_targets"] == "Teacher current target"\n',
                  '    assert context["current_teacher_plan"]["learning_targets"] == "Teacher current target"\n'
                  '    assert context["approved_act_reference_candidates"][0]["reference_id"] == "CLR 401"\n',
              ),
          ])
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install -e '.[dev]'
          ruff check app/act_reference.py app/act_reference_admin_api.py app/ai_planning_api.py tests/test_act_reference.py tests/test_ai_planning_api.py
          mypy app
          pytest tests/test_act_reference.py tests/test_ai_planning_api.py tests/test_frontend_gate_e_components.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/app/ai_planning_api.py backend/tests/test_ai_planning_api.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate governed ACT references into AI planning"
          git push origin HEAD:feature/gate-e-standards-ai
