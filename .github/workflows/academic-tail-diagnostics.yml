name: Academic Tail Diagnostics

on:
  pull_request:
    paths:
      - "backend/app/standards_alabama_social_studies.py"
      - ".github/workflows/academic-tail-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-academic-tails:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect Social Studies government boundary read-only
        working-directory: backend
        run: |
          python - <<'PY'
          from collections import Counter

          from app.standards_alabama_social_studies import (
              _SOURCE_COURSE_ORDER,
              _content_standard_markers,
              _detached_entries_before_marker,
              _next_course_boundary,
              _next_marker_after,
              _parse_social_studies_standards,
          )
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          source_map = {source.source_key: source for source in fetch_current_alabama_catalog()}
          source = source_map["alabama_academic_social_studies"]
          lines = extract_document(fetch_source(source.document_url, source.document_format)).lines
          markers = _content_standard_markers(lines)
          marker_by_course = dict(zip(_SOURCE_COURSE_ORDER, markers, strict=True))
          marker = marker_by_course["grade_12_us_government"]
          next_marker = _next_marker_after(marker, markers, len(lines))
          end = _next_course_boundary(lines, marker, next_marker)
          detached = _detached_entries_before_marker(lines, marker)

          print("database_writes=0")
          print(f"government_marker={marker}|next_marker={next_marker}|end={end}")
          print(f"government_detached_before={detached}")
          print("=== government_prelude ===")
          for index in range(max(0, marker - 55), marker + 1):
              print(f"social|{index}|{lines[index]}")
          print("=== government_body ===")
          for index in range(marker + 1, min(end, marker + 260)):
              print(f"social|{index}|{lines[index]}")

          parsed = _parse_social_studies_standards(
              lines[marker + 1:end],
              initial_detached=tuple(code for _, code in detached),
          )
          codes = [standard.code for standard in parsed]
          duplicates = sorted(code for code, count in Counter(codes).items() if count > 1)
          print(f"parsed_codes={codes}")
          print(f"duplicate_codes={duplicates}")
          for code in duplicates:
              print(f"=== duplicate={code} ===")
              for standard in parsed:
                  if standard.code == code:
                      print(f"{standard.code}|parent={standard.parent_code}|{standard.text}")
          PY
