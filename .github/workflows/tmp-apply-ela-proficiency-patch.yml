name: Temporary ELA proficiency patch applier

on:
  push:
    branches:
      - feature/ela-proficiency-scales-6-12

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ela-proficiency-scales-6-12
      - name: Apply reviewed patch
        run: |
          git apply --check .github/patches/ela-proficiency-scales.patch
          git apply .github/patches/ela-proficiency-scales.patch
          git rm .github/patches/ela-proficiency-scales.patch
          git rm .github/workflows/tmp-apply-ela-proficiency-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/standards_maintenance.py
          git commit -m "Integrate governed ELA proficiency maintenance"
          git push origin HEAD:feature/ela-proficiency-scales-6-12
