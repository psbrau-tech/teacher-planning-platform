name: Enable TPP Pilot TLS

on:
  workflow_dispatch:
    inputs:
      certificate_arn:
        description: Issued ACM certificate ARN for planner.guidedscholar.ai
        required: true
        type: string
      reason:
        description: Reason for attaching the issued certificate
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-infrastructure
  cancel-in-progress: false

jobs:
  enable-tls:
    name: Attach issued ACM certificate
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.TPP_CLOUDFORMATION_ROLE_ARN }}
      STACK_NAME: ${{ vars.TPP_CLOUDFORMATION_STACK || 'TeacherPlanningPlatformPilot' }}
      ECR_REPOSITORY: ${{ vars.TPP_ECR_REPOSITORY || 'teacher-planning-platform-pilot' }}
      ECS_CLUSTER: ${{ vars.TPP_ECS_CLUSTER || 'teacher-planning-platform-pilot' }}
      ECS_SERVICE: ${{ vars.TPP_ECS_SERVICE || 'teacher-planning-platform-pilot' }}
      TASK_DEFINITION_FAMILY: ${{ vars.TPP_TASK_DEFINITION_FAMILY || 'teacher-planning-platform-pilot' }}
      SUPABASE_URL_SECRET_ID: ${{ vars.TPP_SUPABASE_URL_SECRET_ID || 'tpp/pilot/supabase-url' }}
      SUPABASE_ANON_KEY_SECRET_ID: ${{ vars.TPP_SUPABASE_ANON_KEY_SECRET_ID || 'tpp/pilot/supabase-anon-key' }}
    steps:
      - name: Validate controlled TLS configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_ROLE_ARN CLOUDFORMATION_ROLE_ARN STACK_NAME ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE TASK_DEFINITION_FAMILY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required tpp-pilot values: %s\n' "${missing[*]}" >&2
            echo "Run Preflight TPP Pilot Release after correcting the protected environment." >&2
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-2" ]]; then
            echo "The pilot certificate and load balancer must remain in us-east-2." >&2
            exit 1
          fi
          if [[ ! "$CLOUDFORMATION_ROLE_ARN" =~ ^arn:aws:iam::697091778129:role/TeacherPlanningPlatformPilotCloudFormationExecution$ ]]; then
            echo "Unexpected TPP CloudFormation execution-role ARN." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify certificate is issued for the pilot hostname
        shell: bash
        run: |
          set -euo pipefail
          certificate_json="$(aws acm describe-certificate \
            --certificate-arn "${{ inputs.certificate_arn }}" \
            --output json)"
          status="$(jq -r '.Certificate.Status' <<<"$certificate_json")"
          domain="$(jq -r '.Certificate.DomainName' <<<"$certificate_json")"
          if [[ "$status" != "ISSUED" ]]; then
            echo "The ACM certificate is not issued. Current status: $status" >&2
            exit 1
          fi
          if [[ "$domain" != "planner.guidedscholar.ai" ]]; then
            echo "Certificate domain mismatch: $domain" >&2
            exit 1
          fi

      - name: Resolve existing exact image and runtime secrets
        id: values
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"
          if [[ "$(jq '.failures | length' <<<"$service_json")" != "0" ]]; then
            jq '.failures' <<<"$service_json" >&2
            exit 1
          fi
          task_definition="$(jq -r '.services[0].taskDefinition' <<<"$service_json")"
          image="$(aws ecs describe-task-definition \
            --task-definition "$task_definition" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)"
          if [[ -z "$image" || "$image" == "None" || ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The active pilot service is not using an immutable ECR digest." >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"

          resolve_secret() {
            local output_name="$1"
            local secret_id="$2"
            local arn
            arn="$(aws secretsmanager describe-secret \
              --secret-id "$secret_id" \
              --query ARN \
              --output text)"
            if [[ -z "$arn" || "$arn" == "None" ]]; then
              echo "Unable to resolve runtime secret: $secret_id" >&2
              exit 1
            fi
            echo "$output_name=$arn" >> "$GITHUB_OUTPUT"
          }
          resolve_secret supabase_url "$SUPABASE_URL_SECRET_ID"
          resolve_secret supabase_anon_key "$SUPABASE_ANON_KEY_SECRET_ID"

      - name: Attach HTTPS listener and HTTP redirect through CloudFormation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/pilot-stack.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EcrRepositoryName="$ECR_REPOSITORY" \
              EcsClusterName="$ECS_CLUSTER" \
              EcsServiceName="$ECS_SERVICE" \
              TaskDefinitionFamily="$TASK_DEFINITION_FAMILY" \
              ImageUri="${{ steps.values.outputs.image }}" \
              DeployService=true \
              CertificateArn="${{ inputs.certificate_arn }}" \
              PublicBaseUrl=https://planner.guidedscholar.ai \
              AllowedEmailDomains=anniston.k12.al.us \
              SupabaseUrlSecretArn="${{ steps.values.outputs.supabase_url }}" \
              SupabaseAnonKeySecretArn="${{ steps.values.outputs.supabase_anon_key }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify listeners, certificate, target health, and active image
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stack_json="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --output json)"
          output_value() {
            jq -r --arg key "$1" '
              .Stacks[0].Outputs[]
              | select(.OutputKey == $key)
              | .OutputValue
            ' <<<"$stack_json"
          }
          alb_arn="$(output_value LoadBalancerArn)"
          alb_dns="$(output_value LoadBalancerDnsName)"
          target_group_arn="$(output_value TargetGroupArn)"
          listeners="$(aws elbv2 describe-listeners \
            --load-balancer-arn "$alb_arn" \
            --output json)"

          https_listener_arn="$(jq -r '
            .Listeners[]
            | select(.Port == 443 and .Protocol == "HTTPS")
            | .ListenerArn
          ' <<<"$listeners")"
          https_certificate="$(jq -r '
            .Listeners[]
            | select(.Port == 443 and .Protocol == "HTTPS")
            | .Certificates[0].CertificateArn
          ' <<<"$listeners")"
          http_action="$(jq -r '
            .Listeners[]
            | select(.Port == 80 and .Protocol == "HTTP")
            | .DefaultActions[0].Type
          ' <<<"$listeners")"
          if [[ -z "$https_listener_arn" || "$https_listener_arn" == "null" ]]; then
            echo "The HTTPS listener was not created." >&2
            exit 1
          fi
          if [[ "$https_certificate" != "${{ inputs.certificate_arn }}" ]]; then
            echo "The HTTPS listener does not reference the approved certificate." >&2
            exit 1
          fi
          if [[ "$http_action" != "redirect" ]]; then
            echo "The HTTP listener is not configured to redirect to HTTPS." >&2
            exit 1
          fi

          target_health="$(aws elbv2 describe-target-health \
            --target-group-arn "$target_group_arn" \
            --output json)"
          target_count="$(jq '.TargetHealthDescriptions | length' <<<"$target_health")"
          unhealthy_count="$(jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy")] | length' <<<"$target_health")"
          if [[ "$target_count" -lt 1 || "$unhealthy_count" != "0" ]]; then
            jq '.TargetHealthDescriptions' <<<"$target_health" >&2
            exit 1
          fi

          active_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          active_task_json="$(aws ecs describe-task-definition \
            --task-definition "$active_task_definition" \
            --output json)"
          active_image="$(jq -r '.taskDefinition.containerDefinitions[0].image' <<<"$active_task_json")"
          if [[ "$active_image" != "${{ steps.values.outputs.image }}" ]]; then
            echo "TLS attachment changed the accepted application image." >&2
            exit 1
          fi
          secret_names="$(jq -r '.taskDefinition.containerDefinitions[0].secrets[].name' <<<"$active_task_json" | sort)"
          if [[ "$secret_names" != $'TPP_SUPABASE_ANON_KEY\nTPP_SUPABASE_URL' ]]; then
            echo "TLS attachment produced an unexpected ECS runtime secret set:" >&2
            echo "$secret_names" >&2
            exit 1
          fi

          echo "alb_dns=$alb_dns" >> "$GITHUB_OUTPUT"
          echo "active_task_definition=$active_task_definition" >> "$GITHUB_OUTPUT"
          echo "healthy_targets=$target_count" >> "$GITHUB_OUTPUT"

      - name: Publish DNS handoff
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## TPP pilot TLS enabled"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Certificate: \`${{ inputs.certificate_arn }}\`"
            echo "- CloudFormation execution role: \`$CLOUDFORMATION_ROLE_ARN\`"
            echo "- Active image preserved: \`${{ steps.values.outputs.image }}\`"
            echo "- Prior task definition: \`${{ steps.values.outputs.task_definition }}\`"
            echo "- Active task definition: \`${{ steps.verify.outputs.active_task_definition }}\`"
            echo "- Healthy targets: \`${{ steps.verify.outputs.healthy_targets }}\`"
            echo "- Runtime secret mappings: \`TPP_SUPABASE_URL, TPP_SUPABASE_ANON_KEY\`"
            echo "- High-privilege runtime credentials: \`not injected\`"
            echo "- ALB DNS target: \`${{ steps.verify.outputs.alb_dns }}\`"
            echo "- Manual GitHub environment update required: set \`TPP_CERTIFICATE_ARN\` to this certificate ARN."
            echo "- Manual Cloudflare record required: CNAME \`planner\` → \`${{ steps.verify.outputs.alb_dns }}\`, DNS only during acceptance."
            echo "- Keep the ACM validation CNAME in place."
            echo "- Route 53 migration remains deferred and must move the complete \`guidedscholar.ai\` zone together."
          } >> "$GITHUB_STEP_SUMMARY"
