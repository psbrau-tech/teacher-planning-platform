name: AAS Heading Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-aas-headings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect exact heading and code contexts
        run: |
          python - <<'PY'
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          wanted = {
              "alabama_alternate_english_language_arts": (
                  "kindergarten",
                  "ela21.aas.k",
              ),
              "alabama_alternate_mathematics": (
                  "grade 9",
                  "m.g.aas.9",
                  "grade 11",
                  "m.a.aas.11",
              ),
              "alabama_alternate_science": (
                  "grade 11 earth and space science",
                  "sci.aas.ess.hs",
              ),
          }

          for source in fetch_current_alabama_catalog():
              terms = wanted.get(source.source_key)
              if terms is None:
                  continue
              fetched = fetch_source(source.document_url, source.document_format)
              extracted = extract_document(fetched)
              print(f"SOURCE={source.source_key}")
              for index, line in enumerate(extracted.lines):
                  lowered = line.casefold()
                  if not any(term in lowered for term in terms):
                      continue
                  start = max(0, index - 3)
                  end = min(len(extracted.lines), index + 6)
                  print(
                      " || ".join(
                          f"{line_index}:{extracted.lines[line_index]}"
                          for line_index in range(start, end)
                      )
                  )
          PY
