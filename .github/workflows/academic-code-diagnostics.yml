name: Academic Code Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/academic-code-diagnostics.yml'
      - 'backend/app/standards_alabama_health.py'
      - 'backend/app/standards_alabama_physical_education.py'
      - 'backend/app/standards_alabama_social_studies.py'

permissions:
  contents: read

jobs:
  diagnose-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect unresolved duplicate-code contexts read-only
        run: |
          python - <<'PY'
          import collections
          import re

          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          source_map = {s.source_key: s for s in fetch_current_alabama_catalog()}
          targets = {
              'health': (
                  'alabama_academic_health',
                  re.compile(
                      r'^(K|[1-8]|HE|HA|WH)\s*[.-]?\s*(\d+)\s*\.\s*(\d+)([a-z])?',
                      re.I,
                  ),
                  lambda m: (
                      f'{m.group(1).upper()}.{m.group(2)}.{m.group(3)}'
                      f'{(m.group(4) or "").lower()}'
                  ),
              ),
              'physical_education': (
                  'alabama_academic_physical_education',
                  re.compile(
                      r'^(K|[1-8]|BK|AK|SO|AC|SC|LS|VA)\s*-\s*'
                      r'(\d+)\s*\.\s*(\d+)([a-z])?',
                      re.I,
                  ),
                  lambda m: (
                      f'{m.group(1).upper()}-{m.group(2)}.{m.group(3)}'
                      f'{(m.group(4) or "").lower()}'
                  ),
              ),
          }

          print('database_writes=0')
          for label, (key, pattern, keyer) in targets.items():
              source = source_map[key]
              lines = extract_document(
                  fetch_source(source.document_url, source.document_format)
              ).lines
              occurrences = collections.defaultdict(list)
              for index, raw in enumerate(lines):
                  line = re.sub(r'\s+', ' ', raw).strip()
                  match = pattern.match(line)
                  if match:
                      occurrences[keyer(match)].append(index)
              duplicates = {
                  code: indexes
                  for code, indexes in occurrences.items()
                  if len(indexes) > 1
              }
              print(f'=== {label}|duplicate_count={len(duplicates)} ===')
              for code, indexes in sorted(duplicates.items()):
                  print(f'duplicate={code}|indexes={indexes}')
                  for index in indexes:
                      start = max(0, index - 2)
                      end = min(len(lines), index + 3)
                      print(f'-- context_for={code}@{index} --')
                      for context_index in range(start, end):
                          print(f'{context_index}:{lines[context_index]}')

          source = source_map['alabama_academic_social_studies']
          lines = extract_document(
              fetch_source(source.document_url, source.document_format)
          ).lines
          content_markers = [
              index
              for index, line in enumerate(lines)
              if line.lower().replace(' ', '')
              in {'contentstandards', 'contentstandard'}
          ]
          print(f'=== social|section_count={len(content_markers)} ===')
          for section_number, marker in enumerate(content_markers, start=1):
              next_marker = (
                  content_markers[section_number]
                  if section_number < len(content_markers)
                  else len(lines)
              )
              candidates = collections.defaultdict(list)
              for index in range(max(0, marker - 25), next_marker):
                  line = re.sub(r'\s+', ' ', lines[index]).strip()
                  match = re.match(r'^([1-9]\d?)(?:\.|\s|$)', line)
                  if match:
                      candidates[match.group(1)].append(index)
              duplicates = {
                  code: indexes
                  for code, indexes in candidates.items()
                  if len(indexes) > 1
              }
              if not duplicates:
                  continue
              print(
                  f'--- social_section={section_number}|marker={marker}|'
                  f'duplicate_count={len(duplicates)} ---'
              )
              for code, indexes in sorted(
                  duplicates.items(), key=lambda item: int(item[0])
              ):
                  print(f'duplicate={code}|indexes={indexes}')
                  for index in indexes:
                      start = max(0, index - 2)
                      end = min(len(lines), index + 3)
                      print(f'-- context_for={code}@{index} --')
                      for context_index in range(start, end):
                          print(f'{context_index}:{lines[context_index]}')
          PY
