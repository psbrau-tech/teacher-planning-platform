name: Academic Code Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/academic-code-diagnostics.yml'
      - 'backend/app/standards_alabama_health.py'
      - 'backend/app/standards_alabama_physical_education.py'

permissions:
  contents: read

jobs:
  diagnose-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect Health start boundary and PE duplicate context read-only
        run: |
          python - <<'PY'
          import re

          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          source_map = {s.source_key: s for s in fetch_current_alabama_catalog()}
          print('database_writes=0')

          health = source_map['alabama_academic_health']
          health_lines = extract_document(
              fetch_source(health.document_url, health.document_format)
          ).lines
          print('=== health_authoritative_start_context ===')
          for index in range(480, min(len(health_lines), 570)):
              print(f'{index}:{health_lines[index]}')

          pe = source_map['alabama_academic_physical_education']
          pe_lines = extract_document(
              fetch_source(pe.document_url, pe.document_format)
          ).lines
          pattern = re.compile(r'^BK\s*-\s*3\s*\.\s*1(?:\s|$)', re.I)
          indexes = [
              index
              for index, raw in enumerate(pe_lines)
              if pattern.match(re.sub(r'\s+', ' ', raw).strip())
          ]
          print(f'=== pe_bk_3_1_occurrences={indexes} ===')
          for index in indexes:
              print(f'--- pe_context={index} ---')
              for context_index in range(
                  max(0, index - 18),
                  min(len(pe_lines), index + 28),
              ):
                  print(f'{context_index}:{pe_lines[context_index]}')
          PY
