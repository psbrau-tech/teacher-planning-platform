name: Apply TPP Pilot Database Migrations

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for applying the reviewed pilot migrations
        required: true
        type: string
      expected_main_sha:
        description: Exact accepted main commit SHA for this migration run
        required: true
        type: string
      target_migration_head:
        description: Numeric migration version through which this run may operate
        required: true
        type: string
      dry_run_only:
        description: List pending migrations through the target without applying them
        required: true
        default: true
        type: boolean
      apply_target_confirmed:
        description: I approve applying pending migrations only through the exact target head
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and apply Supabase migrations through exact target
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      DATABASE_URL_SECRET_ID: ${{ vars.TPP_DATABASE_URL_SECRET_ID || 'tpp/pilot/database-url' }}
      SUPABASE_CLI_VERSION: '2.101.0'
    steps:
      - name: Validate controlled migration configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_ROLE_ARN DATABASE_URL_SECRET_ID SUPABASE_CLI_VERSION; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required tpp-pilot migration values: %s\n' "${missing[*]}" >&2
            echo "Run Preflight TPP Pilot Release after correcting the protected environment." >&2
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-2" ]]; then
            echo "TPP pilot database operations are governed through us-east-2." >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SUPABASE_CLI_VERSION must be an exact stable semantic version." >&2
            exit 1
          fi
          if [[ "${{ inputs.dry_run_only }}" != "true" \
            && "${{ inputs.apply_target_confirmed }}" != "true" ]]; then
            echo "Database mutation is blocked until the exact migration target is approved." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Enforce exact main commit and migration target
        id: candidate
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIGRATION_HEAD: ${{ inputs.target_migration_head }}
          REQUIRE_MIGRATION_APPLIED_CONFIRMATION: 'false'
        run: bash scripts/verify_exact_release_candidate.sh

      - name: Stage only migrations through approved target
        id: migration_scope
        shell: bash
        run: |
          bash scripts/stage_migrations_through.sh \
            "${{ inputs.target_migration_head }}" \
            "$RUNNER_TEMP/tpp-deferred-migrations"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve database connection without exposing it
        id: database
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)"
          if [[ "$database_url" != postgres://* && "$database_url" != postgresql://* ]]; then
            echo "The configured database secret is not a PostgreSQL connection URL." >&2
            exit 1
          fi
          echo "::add-mask::$database_url"
          printf 'database_url=%s\n' "$database_url" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" --version)"
          if [[ "$version" != "$SUPABASE_CLI_VERSION" ]]; then
            echo "Supabase CLI version mismatch: expected $SUPABASE_CLI_VERSION, received $version" >&2
            exit 1
          fi

      - name: Validate migration history and preview target changes
        env:
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        shell: bash
        run: |
          set -euo pipefail
          cli=(npx --yes "supabase@$SUPABASE_CLI_VERSION")
          "${cli[@]}" migration list --db-url "$DATABASE_URL"
          "${cli[@]}" db push --db-url "$DATABASE_URL" --dry-run --include-all

      - name: Apply reviewed migrations through exact target
        if: ${{ !inputs.dry_run_only }}
        env:
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        shell: bash
        run: |
          set -euo pipefail
          cli=(npx --yes "supabase@$SUPABASE_CLI_VERSION")
          "${cli[@]}" db push --db-url "$DATABASE_URL" --include-all --yes
          "${cli[@]}" migration list --db-url "$DATABASE_URL"
          "${cli[@]}" db push --db-url "$DATABASE_URL" --dry-run --include-all

      - name: Publish migration handoff
        shell: bash
        run: |
          set -euo pipefail
          staged_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          {
            echo "## TPP pilot database migration"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Expected main SHA: \`${{ inputs.expected_main_sha }}\`"
            echo "- Target migration head: \`${{ inputs.target_migration_head }}\`"
            echo "- Target migration file: \`${{ steps.candidate.outputs.migration_file }}\`"
            echo "- Dry run only: \`${{ inputs.dry_run_only }}\`"
            echo "- Exact target approved for mutation: \`${{ inputs.apply_target_confirmed }}\`"
            echo "- Region governance: \`$AWS_REGION\`"
            echo "- Supabase CLI: \`$SUPABASE_CLI_VERSION\`"
            echo "- Staged migration count: \`$staged_count\`"
            echo "- Deferred later migrations: \`${{ steps.migration_scope.outputs.deferred_count }}\`"
            echo "- Migration source: \`supabase/migrations\` staged through the approved head"
            echo "- Data boundary: teacher and curriculum data only; no student data"
            if [[ "${{ inputs.dry_run_only }}" == "true" ]]; then
              echo "- No database mutation was authorized by this run."
            else
              echo "- Reviewed pending migrations were applied only through the approved target."
              echo "- A final dry run confirmed no migration through that target remained pending."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
