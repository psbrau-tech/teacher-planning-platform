name: Bootstrap TPP Pilot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for creating or updating the isolated pilot stack
        required: true
        type: string
      request_certificate:
        description: Request or reuse an ACM certificate for planner.guidedscholar.ai
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-infrastructure
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Provision foundation and deploy first exact image
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      STACK_NAME: ${{ vars.TPP_CLOUDFORMATION_STACK || 'TeacherPlanningPlatformPilot' }}
      ECR_REPOSITORY: ${{ vars.TPP_ECR_REPOSITORY || 'teacher-planning-platform-pilot' }}
      ECS_CLUSTER: ${{ vars.TPP_ECS_CLUSTER || 'teacher-planning-platform-pilot' }}
      ECS_SERVICE: ${{ vars.TPP_ECS_SERVICE || 'teacher-planning-platform-pilot' }}
      TASK_DEFINITION_FAMILY: ${{ vars.TPP_TASK_DEFINITION_FAMILY || 'teacher-planning-platform-pilot' }}
      VITE_SUPABASE_URL: ${{ vars.TPP_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TPP_SUPABASE_ANON_KEY }}
      CERTIFICATE_ARN: ${{ vars.TPP_CERTIFICATE_ARN }}
      SUPABASE_URL_SECRET_ID: ${{ vars.TPP_SUPABASE_URL_SECRET_ID || 'tpp/pilot/supabase-url' }}
      SUPABASE_ANON_KEY_SECRET_ID: ${{ vars.TPP_SUPABASE_ANON_KEY_SECRET_ID || 'tpp/pilot/supabase-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET_ID: ${{ vars.TPP_SUPABASE_SERVICE_ROLE_KEY_SECRET_ID || 'tpp/pilot/supabase-service-role-key' }}
      DATABASE_URL_SECRET_ID: ${{ vars.TPP_DATABASE_URL_SECRET_ID || 'tpp/pilot/database-url' }}
      OPENAI_API_KEY_SECRET_ID: ${{ vars.TPP_OPENAI_API_KEY_SECRET_ID || 'tpp/pilot/openai-api-key' }}
      GOOGLE_OAUTH_CLIENT_ID_SECRET_ID: ${{ vars.TPP_GOOGLE_OAUTH_CLIENT_ID_SECRET_ID || 'tpp/pilot/google-oauth-client-id' }}
      GOOGLE_OAUTH_CLIENT_SECRET_SECRET_ID: ${{ vars.TPP_GOOGLE_OAUTH_CLIENT_SECRET_SECRET_ID || 'tpp/pilot/google-oauth-client-secret' }}
    steps:
      - name: Validate controlled bootstrap configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required tpp-pilot environment variable: $name" >&2
              exit 1
            fi
          done
          if [[ "$AWS_REGION" != "us-east-2" ]]; then
            echo "TPP pilot infrastructure is locked to us-east-2." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infra/pilot-stack.yml

      - name: Resolve exact Secrets Manager ARNs
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          resolve_secret() {
            local output_name="$1"
            local secret_id="$2"
            local arn
            arn="$(aws secretsmanager describe-secret \
              --secret-id "$secret_id" \
              --query ARN \
              --output text)"
            if [[ -z "$arn" || "$arn" == "None" ]]; then
              echo "Unable to resolve secret: $secret_id" >&2
              exit 1
            fi
            echo "$output_name=$arn" >> "$GITHUB_OUTPUT"
          }
          resolve_secret supabase_url "$SUPABASE_URL_SECRET_ID"
          resolve_secret supabase_anon_key "$SUPABASE_ANON_KEY_SECRET_ID"
          resolve_secret supabase_service_role_key "$SUPABASE_SERVICE_ROLE_KEY_SECRET_ID"
          resolve_secret database_url "$DATABASE_URL_SECRET_ID"
          resolve_secret openai_api_key "$OPENAI_API_KEY_SECRET_ID"
          resolve_secret google_oauth_client_id "$GOOGLE_OAUTH_CLIENT_ID_SECRET_ID"
          resolve_secret google_oauth_client_secret "$GOOGLE_OAUTH_CLIENT_SECRET_SECRET_ID"

      - name: Provision pilot foundation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/pilot-stack.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EcrRepositoryName="$ECR_REPOSITORY" \
              EcsClusterName="$ECS_CLUSTER" \
              EcsServiceName="$ECS_SERVICE" \
              TaskDefinitionFamily="$TASK_DEFINITION_FAMILY" \
              DeployService=false \
              CertificateArn="$CERTIFICATE_ARN" \
              SupabaseUrlSecretArn="${{ steps.secrets.outputs.supabase_url }}" \
              SupabaseAnonKeySecretArn="${{ steps.secrets.outputs.supabase_anon_key }}" \
              SupabaseServiceRoleKeySecretArn="${{ steps.secrets.outputs.supabase_service_role_key }}" \
              DatabaseUrlSecretArn="${{ steps.secrets.outputs.database_url }}" \
              OpenAiApiKeySecretArn="${{ steps.secrets.outputs.openai_api_key }}" \
              GoogleOauthClientIdSecretArn="${{ steps.secrets.outputs.google_oauth_client_id }}" \
              GoogleOauthClientSecretSecretArn="${{ steps.secrets.outputs.google_oauth_client_secret }}"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push initial exact image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          tagged_image="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build \
            --build-arg "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-arg "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$tagged_image" \
            .
          docker push "$tagged_image"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ -z "$digest" || "$digest" == "None" ]]; then
            echo "ECR did not return an image digest." >&2
            exit 1
          fi
          immutable_image="$ECR_REGISTRY/$ECR_REPOSITORY@$digest"
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy initial ECS service
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/pilot-stack.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EcrRepositoryName="$ECR_REPOSITORY" \
              EcsClusterName="$ECS_CLUSTER" \
              EcsServiceName="$ECS_SERVICE" \
              TaskDefinitionFamily="$TASK_DEFINITION_FAMILY" \
              ImageUri="${{ steps.image.outputs.immutable_image }}" \
              DeployService=true \
              CertificateArn="$CERTIFICATE_ARN" \
              PublicBaseUrl=https://planner.guidedscholar.ai \
              AllowedEmailDomains=anniston.k12.al.us \
              SupabaseUrlSecretArn="${{ steps.secrets.outputs.supabase_url }}" \
              SupabaseAnonKeySecretArn="${{ steps.secrets.outputs.supabase_anon_key }}" \
              SupabaseServiceRoleKeySecretArn="${{ steps.secrets.outputs.supabase_service_role_key }}" \
              DatabaseUrlSecretArn="${{ steps.secrets.outputs.database_url }}" \
              OpenAiApiKeySecretArn="${{ steps.secrets.outputs.openai_api_key }}" \
              GoogleOauthClientIdSecretArn="${{ steps.secrets.outputs.google_oauth_client_id }}" \
              GoogleOauthClientSecretSecretArn="${{ steps.secrets.outputs.google_oauth_client_secret }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify load balancer health and exact image
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          alb_dns="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDnsName'].OutputValue | [0]" \
            --output text)"
          target_group_arn="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TargetGroupArn'].OutputValue | [0]" \
            --output text)"
          for attempt in {1..30}; do
            if curl --fail --silent "http://$alb_dns/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              aws elbv2 describe-target-health --target-group-arn "$target_group_arn"
              exit 1
            fi
            sleep 10
          done

          task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          deployed_image="$(aws ecs describe-task-definition \
            --task-definition "$task_definition" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)"
          if [[ "$deployed_image" != "${{ steps.image.outputs.immutable_image }}" ]]; then
            echo "Initial service image does not match the exact pushed digest." >&2
            exit 1
          fi
          echo "alb_dns=$alb_dns" >> "$GITHUB_OUTPUT"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"

      - name: Request or reuse ACM certificate
        if: ${{ inputs.request_certificate }}
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_arn="$CERTIFICATE_ARN"
          if [[ -z "$certificate_arn" ]]; then
            certificate_arn="$(aws acm list-certificates \
              --certificate-statuses ISSUED PENDING_VALIDATION \
              --query "CertificateSummaryList[?DomainName=='planner.guidedscholar.ai'].CertificateArn | [0]" \
              --output text)"
          fi
          if [[ -z "$certificate_arn" || "$certificate_arn" == "None" ]]; then
            certificate_arn="$(aws acm request-certificate \
              --domain-name planner.guidedscholar.ai \
              --validation-method DNS \
              --idempotency-token tpppilot \
              --options CertificateTransparencyLoggingPreference=ENABLED \
              --query CertificateArn \
              --output text)"
          fi

          validation_name=""
          validation_value=""
          for attempt in {1..20}; do
            validation_name="$(aws acm describe-certificate \
              --certificate-arn "$certificate_arn" \
              --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' \
              --output text)"
            validation_value="$(aws acm describe-certificate \
              --certificate-arn "$certificate_arn" \
              --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' \
              --output text)"
            if [[ -n "$validation_name" && "$validation_name" != "None" && -n "$validation_value" && "$validation_value" != "None" ]]; then
              break
            fi
            sleep 3
          done
          if [[ -z "$validation_name" || "$validation_name" == "None" ]]; then
            echo "ACM did not return its DNS validation record." >&2
            exit 1
          fi
          echo "certificate_arn=$certificate_arn" >> "$GITHUB_OUTPUT"
          echo "validation_name=$validation_name" >> "$GITHUB_OUTPUT"
          echo "validation_value=$validation_value" >> "$GITHUB_OUTPUT"

      - name: Publish controlled handoff
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## TPP pilot bootstrap"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Stack: \`$STACK_NAME\`"
            echo "- ALB DNS: \`${{ steps.verify.outputs.alb_dns }}\`"
            echo "- Image: \`${{ steps.image.outputs.immutable_image }}\`"
            echo "- Task definition: \`${{ steps.verify.outputs.task_definition }}\`"
            echo "- Data boundary: teacher and curriculum data only; no student data"
            if [[ "${{ inputs.request_certificate }}" == "true" ]]; then
              echo "- ACM certificate: \`${{ steps.certificate.outputs.certificate_arn }}\`"
              echo "- Required Cloudflare ACM validation CNAME name: \`${{ steps.certificate.outputs.validation_name }}\`"
              echo "- Required Cloudflare ACM validation CNAME value: \`${{ steps.certificate.outputs.validation_value }}\`"
              echo "- Do not add the planner application CNAME until ACM is issued and HTTPS is attached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
