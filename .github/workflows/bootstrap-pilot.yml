name: Bootstrap TPP Pilot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for creating or updating the isolated pilot stack
        required: true
        type: string
      request_certificate:
        description: Request or reuse an ACM certificate for planner.guidedscholar.ai
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-infrastructure
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Provision foundation and deploy first exact image
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.TPP_CLOUDFORMATION_ROLE_ARN }}
      STACK_NAME: ${{ vars.TPP_CLOUDFORMATION_STACK || 'TeacherPlanningPlatformPilot' }}
      ECR_REPOSITORY: ${{ vars.TPP_ECR_REPOSITORY || 'teacher-planning-platform-pilot' }}
      ECS_CLUSTER: ${{ vars.TPP_ECS_CLUSTER || 'teacher-planning-platform-pilot' }}
      ECS_SERVICE: ${{ vars.TPP_ECS_SERVICE || 'teacher-planning-platform-pilot' }}
      TASK_DEFINITION_FAMILY: ${{ vars.TPP_TASK_DEFINITION_FAMILY || 'teacher-planning-platform-pilot' }}
      VITE_SUPABASE_URL: ${{ vars.TPP_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TPP_SUPABASE_ANON_KEY }}
      CERTIFICATE_ARN: ${{ vars.TPP_CERTIFICATE_ARN }}
      SUPABASE_URL_SECRET_ID: ${{ vars.TPP_SUPABASE_URL_SECRET_ID || 'tpp/pilot/supabase-url' }}
      SUPABASE_ANON_KEY_SECRET_ID: ${{ vars.TPP_SUPABASE_ANON_KEY_SECRET_ID || 'tpp/pilot/supabase-anon-key' }}
      OPENAI_API_KEY_SECRET_ID: ${{ vars.TPP_OPENAI_API_KEY_SECRET_ID || 'tpp/pilot/openai-api-key' }}
      REASON: ${{ inputs.reason }}
      REQUEST_CERTIFICATE: ${{ inputs.request_certificate }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify named stack read permission
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if ! aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" >/dev/null 2>"$error_file"; then
            if ! grep -q 'does not exist' "$error_file"; then
              cat "$error_file" >&2
              rm -f "$error_file"
              exit 1
            fi
          fi
          rm -f "$error_file"

      - name: Bootstrap through the dedicated CloudFormation execution role
        shell: bash
        run: bash scripts/bootstrap_pilot.sh
