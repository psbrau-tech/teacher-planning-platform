name: AAS Source Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-aas-sources:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect AAS source sizes and repeated raw codes
        run: |
          python - <<'PY'
          import re
          from collections import Counter, defaultdict

          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          code_pattern = re.compile(
              r"(?:ELA21|ELA|M|SCI|SS)(?:\.(?!AAS\b)[A-Za-z0-9]+)*"
              r"\.AAS\.[A-Za-z0-9.]+",
              flags=re.IGNORECASE,
          )

          sources = [
              source
              for source in fetch_current_alabama_catalog()
              if source.family == "alabama_alternate"
          ]
          print("database_writes=0")
          print(f"alternate_source_count={len(sources)}")

          for source in sources:
              print(f"SOURCE {source.source_key} {source.document_url}")
              fetched = fetch_source(
                  source.document_url,
                  source.document_format,
                  max_source_bytes=100 * 1024 * 1024,
              )
              print(
                  f"bytes={len(fetched.content)} sha256={fetched.source_sha256}"
              )
              extracted = extract_document(fetched)
              print(f"lines={len(extracted.lines)} normalized={extracted.normalized_sha256}")

              occurrences: dict[str, list[int]] = defaultdict(list)
              for index, line in enumerate(extracted.lines):
                  for match in code_pattern.finditer(line):
                      occurrences[match.group(0).upper()].append(index)

              duplicates = {
                  code: indexes
                  for code, indexes in occurrences.items()
                  if len(indexes) > 1
              }
              print(
                  f"raw_aas_codes={len(occurrences)} "
                  f"duplicate_code_count={len(duplicates)}"
              )
              for code, indexes in list(sorted(duplicates.items()))[:20]:
                  print(f"DUPLICATE {code} indexes={indexes}")
                  for index in indexes:
                      start = max(0, index - 2)
                      end = min(len(extracted.lines), index + 3)
                      context = " || ".join(
                          f"{line_index}:{extracted.lines[line_index]}"
                          for line_index in range(start, end)
                      )
                      print(f"CONTEXT {context}")

              counts = Counter(
                  match.group(0).upper()
                  for line in extracted.lines
                  for match in code_pattern.finditer(line)
              )
              print(f"max_code_occurrences={max(counts.values(), default=0)}")
          PY
