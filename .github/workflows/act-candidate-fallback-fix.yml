name: ACT Candidate Fallback Fix

on:
  pull_request:
    paths:
      - ".github/workflows/act-candidate-fallback-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-e-standards-ai
          fetch-depth: 0
      - name: Preserve bounded candidates when lexical overlap is zero
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/act_reference.py")
          text = path.read_text()
          old = "    return [row for score, _, row in scored if score > 0][:limit]\n"
          new = (
              "    # Positive lexical matches rank first. Zero-overlap entries fill the remaining\\n"
              "    # bounded candidate window so the model can still identify a legitimate cross-\\n"
              "    # curricular ACT connection without ever inventing an ACT reference.\\n"
              "    return [row for _, _, row in scored][:limit]\\n"
          ).replace("\\n", "\n")
          if text.count(old) != 1:
              raise SystemExit("ACT candidate return anchor changed")
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify formatting
        run: |
          python -m pip install ruff==0.16.2
          ruff format backend/app/act_reference.py
          ruff check backend/app/act_reference.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/act_reference.py
          git diff --cached --quiet && exit 0
          git commit -m "Keep ACT alignment candidates bounded when overlap is sparse"
          git push origin HEAD:feature/gate-e-standards-ai
