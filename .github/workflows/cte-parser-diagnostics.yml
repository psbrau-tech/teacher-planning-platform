name: CTE Parser Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/cte-parser-diagnostics.yml'
      - 'backend/app/standards_alabama_parsers.py'

permissions:
  contents: read

jobs:
  diagnose-cte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Inspect failing current CTE sources read-only
        run: |
          python - <<'PY'
          from app.standards_catalog_fetch import fetch_current_alabama_catalog
          from app.standards_ingest import extract_document, fetch_source

          targets = {
              'alabama_cte_cos_agriculture_food_natural_resources',
              'alabama_cte_cos_education_training',
              'alabama_cte_cos_law_public_safety_corrections_security',
              'alabama_cte_cos_stem',
          }
          sources = {s.source_key: s for s in fetch_current_alabama_catalog()}
          print('database_writes=0')
          for key in sorted(targets):
              source = sources[key]
              extracted = extract_document(fetch_source(source.document_url, source.document_format))
              print(f'=== {key} | {source.title} ===')
              matches = [
                  (i, line) for i, line in enumerate(extracted.lines)
                  if 'standard' in line.lower() or 'course' in line.lower()
              ]
              for i, line in matches[:120]:
                  start = max(0, i - 2)
                  end = min(len(extracted.lines), i + 4)
                  print(f'context[{i}]=' + ' || '.join(extracted.lines[start:end]))
          PY
