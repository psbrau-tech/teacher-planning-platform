name: Enable TPP Friday Notifications

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for enabling automatic Friday professional notifications
        required: true
        type: string
      supabase_service_role_secret_arn:
        description: Secrets Manager ARN for tpp/pilot/supabase-service-role-key
        required: true
        type: string
      friday_notification_migration_applied_confirmed:
        description: I confirmed the scheduled Friday notification migration is applied
        required: true
        default: false
        type: boolean
      ses_notifications_active_confirmed:
        description: I confirmed the approved SES sender infrastructure is active
        required: true
        default: false
        type: boolean
      schedule_times_approved:
        description: I approved Friday 2:00 PM teacher and 3:30 PM administrator schedules in America/Chicago
        required: true
        default: false
        type: boolean
      privacy_help_review_confirmed:
        description: I confirmed privacy/subprocessor and Help review for automatic delivery
        required: true
        default: false
        type: boolean
      deployment_role_policies_updated_confirmed:
        description: I confirmed governed AWS deployment-role policies match this release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tpp-pilot-infrastructure
  cancel-in-progress: false

jobs:
  enable-friday-notifications:
    name: Enable isolated Friday teacher and administrator notifications
    runs-on: ubuntu-latest
    environment: tpp-pilot
    env:
      AWS_REGION: ${{ vars.TPP_AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ vars.TPP_AWS_ROLE_ARN }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.TPP_CLOUDFORMATION_ROLE_ARN }}
      MAIN_STACK_NAME: ${{ vars.TPP_CLOUDFORMATION_STACK || 'TeacherPlanningPlatformPilot' }}
      SCHEDULED_STACK_NAME: TeacherPlanningPlatformPilotScheduledDigest
      ECS_CLUSTER: ${{ vars.TPP_ECS_CLUSTER || 'teacher-planning-platform-pilot' }}
      ECS_SERVICE: ${{ vars.TPP_ECS_SERVICE || 'teacher-planning-platform-pilot' }}
      SES_FROM_EMAIL: notifications@planner.guidedscholar.ai
      TEACHER_SCHEDULE_EXPRESSION: cron(0 14 ? * FRI *)
      ADMIN_SCHEDULE_EXPRESSION: cron(30 15 ? * FRI *)
      SCHEDULE_TIMEZONE: America/Chicago
      SUPABASE_SERVICE_ROLE_SECRET_ARN: ${{ inputs.supabase_service_role_secret_arn }}

    steps:
      - name: Enforce manual automatic-delivery gates
        shell: bash
        run: |
          set -euo pipefail
          declare -A gates=(
            [friday_notification_migration_applied_confirmed]="${{ inputs.friday_notification_migration_applied_confirmed }}"
            [ses_notifications_active_confirmed]="${{ inputs.ses_notifications_active_confirmed }}"
            [schedule_times_approved]="${{ inputs.schedule_times_approved }}"
            [privacy_help_review_confirmed]="${{ inputs.privacy_help_review_confirmed }}"
            [deployment_role_policies_updated_confirmed]="${{ inputs.deployment_role_policies_updated_confirmed }}"
          )
          for gate in "${!gates[@]}"; do
            if [[ "${gates[$gate]}" != "true" ]]; then
              echo "Friday notification activation is blocked by $gate." >&2
              exit 1
            fi
          done

      - name: Validate exact activation inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(AWS_ROLE_ARN CLOUDFORMATION_ROLE_ARN MAIN_STACK_NAME ECS_CLUSTER ECS_SERVICE)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required tpp-pilot value: $name" >&2
              exit 1
            fi
          done
          [[ "$AWS_REGION" == "us-east-2" ]] || { echo "Friday notification infrastructure is locked to us-east-2." >&2; exit 1; }
          [[ "$SCHEDULE_TIMEZONE" == "America/Chicago" ]] || { echo "Unexpected Friday notification timezone." >&2; exit 1; }
          [[ "$TEACHER_SCHEDULE_EXPRESSION" == 'cron(0 14 ? * FRI *)' ]] || exit 1
          [[ "$ADMIN_SCHEDULE_EXPRESSION" == 'cron(30 15 ? * FRI *)' ]] || exit 1
          expected_cloudformation_role="arn:aws:iam::697091778129:role/TeacherPlanningPlatformPilotCloudFormationExecution"
          [[ "$CLOUDFORMATION_ROLE_ARN" == "$expected_cloudformation_role" ]] || { echo "Unexpected TPP CloudFormation execution-role ARN." >&2; exit 1; }
          expected_secret_prefix="arn:aws:secretsmanager:us-east-2:697091778129:secret:tpp/pilot/supabase-service-role-key-"
          [[ "$SUPABASE_SERVICE_ROLE_SECRET_ARN" == "$expected_secret_prefix"* ]] || { echo "Unexpected Supabase service-role secret ARN." >&2; exit 1; }

      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate templates and accepted pilot baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/pilot-stack.yml >/dev/null
          aws cloudformation validate-template --template-body file://infra/scheduled-admin-digest-stack.yml >/dev/null

          stack_json="$(aws cloudformation describe-stacks --stack-name "$MAIN_STACK_NAME" --output json)"
          stack_status="$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")"
          case "$stack_status" in CREATE_COMPLETE|UPDATE_COMPLETE) ;; *) echo "Pilot stack is not stable: $stack_status" >&2; exit 1 ;; esac
          output_value() { jq -r --arg key "$1" '.Stacks[0].Outputs[] | select(.OutputKey == $key) | .OutputValue' <<<"$stack_json"; }
          parameter_value() { jq -r --arg key "$1" '.Stacks[0].Parameters[] | select(.ParameterKey == $key) | .ParameterValue' <<<"$stack_json"; }
          [[ "$(output_value SesNotificationsStatus)" == "configured" ]] || { echo "Approved SES sender infrastructure is not active." >&2; exit 1; }
          [[ "$(output_value SesFromAddress)" == "$SES_FROM_EMAIL" ]] || { echo "Active pilot stack does not use the approved TPP From address." >&2; exit 1; }
          ses_identity_arn="$(parameter_value SesIdentityArn)"
          allowed_email_domains="$(parameter_value AllowedEmailDomains)"
          public_base_url="$(parameter_value PublicBaseUrl)"
          [[ -n "$ses_identity_arn" && "$ses_identity_arn" != "null" ]] || { echo "Pilot stack has no active SES identity ARN." >&2; exit 1; }

          service_json="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json)"
          [[ "$(jq '.failures | length' <<<"$service_json")" == "0" ]] || exit 1
          task_definition="$(jq -r '.services[0].taskDefinition' <<<"$service_json")"
          cluster_arn="$(jq -r '.services[0].clusterArn' <<<"$service_json")"
          subnets_csv="$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.subnets | join(",")' <<<"$service_json")"
          security_groups_csv="$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups | join(",")' <<<"$service_json")"
          [[ "$security_groups_csv" != *,* ]] || { echo "Expected one governed task security group." >&2; exit 1; }

          task_json="$(aws ecs describe-task-definition --task-definition "$task_definition" --output json)"
          image="$(jq -r '.taskDefinition.containerDefinitions[0].image' <<<"$task_json")"
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Current pilot image is not immutable." >&2; exit 1; }
          supabase_url_secret_arn="$(jq -r '.taskDefinition.containerDefinitions[0].secrets[] | select(.name == "TPP_SUPABASE_URL") | .valueFrom' <<<"$task_json")"
          [[ -n "$supabase_url_secret_arn" && "$supabase_url_secret_arn" != "null" ]] || exit 1
          if jq -e '.taskDefinition.containerDefinitions[0].secrets[] | select(.name == "TPP_SUPABASE_SERVICE_ROLE_KEY")' <<<"$task_json" >/dev/null; then
            echo "Interactive web task must not contain the Supabase service-role credential." >&2
            exit 1
          fi
          {
            echo "image=$image"
            echo "cluster_arn=$cluster_arn"
            echo "subnets_csv=$subnets_csv"
            echo "security_group=$security_groups_csv"
            echo "supabase_url_secret_arn=$supabase_url_secret_arn"
            echo "ses_identity_arn=$ses_identity_arn"
            echo "allowed_email_domains=$allowed_email_domains"
            echo "public_base_url=$public_base_url"
          } >> "$GITHUB_OUTPUT"

      - name: Stage both Friday schedules disabled
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$SCHEDULED_STACK_NAME" \
            --template-file infra/scheduled-admin-digest-stack.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ClusterArn="${{ steps.baseline.outputs.cluster_arn }}" \
              PublicSubnetIds="${{ steps.baseline.outputs.subnets_csv }}" \
              TaskSecurityGroupId="${{ steps.baseline.outputs.security_group }}" \
              ImageUri="${{ steps.baseline.outputs.image }}" \
              PublicBaseUrl="${{ steps.baseline.outputs.public_base_url }}" \
              AllowedEmailDomains="${{ steps.baseline.outputs.allowed_email_domains }}" \
              SupabaseUrlSecretArn="${{ steps.baseline.outputs.supabase_url_secret_arn }}" \
              SupabaseServiceRoleSecretArn="$SUPABASE_SERVICE_ROLE_SECRET_ARN" \
              SesIdentityArn="${{ steps.baseline.outputs.ses_identity_arn }}" \
              SesFromEmail="$SES_FROM_EMAIL" \
              TeacherScheduleExpression="$TEACHER_SCHEDULE_EXPRESSION" \
              AdminScheduleExpression="$ADMIN_SCHEDULE_EXPRESSION" \
              ScheduleTimezone="$SCHEDULE_TIMEZONE" \
              ScheduleState=DISABLED

      - name: Verify staged workers and schedules without sending email
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$SCHEDULED_STACK_NAME" --output json)"
          output_value() { jq -r --arg key "$1" '.Stacks[0].Outputs[] | select(.OutputKey == $key) | .OutputValue' <<<"$stack"; }
          [[ "$(output_value ScheduleState)" == "DISABLED" ]] || exit 1
          [[ "$(output_value TeacherScheduleExpression)" == "$TEACHER_SCHEDULE_EXPRESSION" ]] || exit 1
          [[ "$(output_value AdminScheduleExpression)" == "$ADMIN_SCHEDULE_EXPRESSION" ]] || exit 1
          [[ "$(output_value ScheduleTimezone)" == "$SCHEDULE_TIMEZONE" ]] || exit 1

          teacher_task="$(output_value TeacherTaskDefinitionArn)"
          admin_task="$(output_value AdminTaskDefinitionArn)"
          for specification in "teacher:$teacher_task" "admin:$admin_task"; do
            mode="${specification%%:*}"
            task="${specification#*:}"
            task_json="$(aws ecs describe-task-definition --task-definition "$task" --output json)"
            image="$(jq -r '.taskDefinition.containerDefinitions[0].image' <<<"$task_json")"
            [[ "$image" == "${{ steps.baseline.outputs.image }}" ]] || exit 1
            command_json="$(jq -c '.taskDefinition.containerDefinitions[0].command' <<<"$task_json")"
            [[ "$command_json" == "[\"python\",\"-m\",\"app.scheduled_digest_worker\",\"$mode\"]" ]] || { echo "Unexpected $mode worker command." >&2; exit 1; }
            secret_names="$(jq -r '.taskDefinition.containerDefinitions[0].secrets[].name' <<<"$task_json" | sort)"
            [[ "$secret_names" == $'TPP_SUPABASE_SERVICE_ROLE_KEY\nTPP_SUPABASE_URL' ]] || exit 1
          done

          for specification in "tpp-pilot-teacher-friday-reminder:$TEACHER_SCHEDULE_EXPRESSION" "tpp-pilot-admin-weekly-digest:$ADMIN_SCHEDULE_EXPRESSION"; do
            schedule_name="${specification%%:*}"
            expected_expression="${specification#*:}"
            schedule_json="$(aws scheduler get-schedule --name "$schedule_name" --output json)"
            [[ "$(jq -r '.State' <<<"$schedule_json")" == "DISABLED" ]] || exit 1
            [[ "$(jq -r '.ScheduleExpression' <<<"$schedule_json")" == "$expected_expression" ]] || exit 1
            [[ "$(jq -r '.ScheduleExpressionTimezone' <<<"$schedule_json")" == "$SCHEDULE_TIMEZONE" ]] || exit 1
          done

      - name: Enable verified Friday schedules
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$SCHEDULED_STACK_NAME" \
            --template-file infra/scheduled-admin-digest-stack.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ClusterArn="${{ steps.baseline.outputs.cluster_arn }}" \
              PublicSubnetIds="${{ steps.baseline.outputs.subnets_csv }}" \
              TaskSecurityGroupId="${{ steps.baseline.outputs.security_group }}" \
              ImageUri="${{ steps.baseline.outputs.image }}" \
              PublicBaseUrl="${{ steps.baseline.outputs.public_base_url }}" \
              AllowedEmailDomains="${{ steps.baseline.outputs.allowed_email_domains }}" \
              SupabaseUrlSecretArn="${{ steps.baseline.outputs.supabase_url_secret_arn }}" \
              SupabaseServiceRoleSecretArn="$SUPABASE_SERVICE_ROLE_SECRET_ARN" \
              SesIdentityArn="${{ steps.baseline.outputs.ses_identity_arn }}" \
              SesFromEmail="$SES_FROM_EMAIL" \
              TeacherScheduleExpression="$TEACHER_SCHEDULE_EXPRESSION" \
              AdminScheduleExpression="$ADMIN_SCHEDULE_EXPRESSION" \
              ScheduleTimezone="$SCHEDULE_TIMEZONE" \
              ScheduleState=ENABLED

      - name: Verify enabled schedules without sending email
        shell: bash
        run: |
          set -euo pipefail
          for specification in "tpp-pilot-teacher-friday-reminder:$TEACHER_SCHEDULE_EXPRESSION" "tpp-pilot-admin-weekly-digest:$ADMIN_SCHEDULE_EXPRESSION"; do
            schedule_name="${specification%%:*}"
            expected_expression="${specification#*:}"
            schedule_json="$(aws scheduler get-schedule --name "$schedule_name" --output json)"
            [[ "$(jq -r '.State' <<<"$schedule_json")" == "ENABLED" ]] || exit 1
            [[ "$(jq -r '.ScheduleExpression' <<<"$schedule_json")" == "$expected_expression" ]] || exit 1
            [[ "$(jq -r '.ScheduleExpressionTimezone' <<<"$schedule_json")" == "$SCHEDULE_TIMEZONE" ]] || exit 1
          done
          {
            echo "## TPP Friday notification activation"
            echo "- Teacher reminder: Friday 2:00 PM America/Chicago"
            echo "- Administrator digest: Friday 3:30 PM America/Chicago"
            echo "- Sender: $SES_FROM_EMAIL"
            echo "- Immediate/test email sent by this workflow: no"
            echo "- Data boundary: teacher and curriculum professional data only; no student data"
          } >> "$GITHUB_STEP_SUMMARY"
